<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>工作檢核台｜班級管理系統</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✔</text></svg>" />
<link rel="stylesheet" href="assets/css/projection.css?v=20260911-2" />
<style>
/* 分頁列＝一天的時序：到校 → 打掃 → 作業 → 午餐 → 潔牙（老師 2026-09-06 拍板） */
.tabs{flex:0 0 auto;display:flex;gap:.6vw;align-items:center;flex-wrap:wrap;margin-bottom:1.2vh}
.tabs button{font-family:inherit;font-size:clamp(15px,2.1vh,24px);font-weight:700;color:var(--chalk-2);
  background:var(--board-2);border:2px solid var(--line);border-radius:999px;padding:.5em 1.1em;cursor:pointer}
.tabs button.on{background:var(--duty);border-color:transparent;color:#08201d}
.tabs button .step{font-size:.72em;opacity:.7;margin-right:.35em;font-variant-numeric:tabular-nums}
.tabs .grow{flex:1 1 auto}
.tabs .legend{display:flex;gap:1vw;font-size:clamp(13px,1.7vh,19px);color:var(--chalk-3);flex-wrap:wrap}
.tabs .legend b{font-weight:800}

/* 掃區子頁籤：一區一頁，監督同學只點自己那一頁（2026-09-06 老師指定） */
.ztabs{display:flex;gap:.5vw;flex-wrap:wrap}
.ztabs button{font-family:inherit;font-size:clamp(14px,1.9vh,21px);font-weight:600;color:var(--chalk-2);
  background:var(--board-3);border:2px solid var(--line-2);border-radius:999px;padding:.35em .95em;cursor:pointer}
.ztabs button.on{background:var(--blue);border-color:transparent;color:#08152a;font-weight:800}
.ztabs button .n{font-size:.8em;opacity:.85;margin-left:.35em}

.view{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1.2vh;
  padding-bottom:9vh}   /* 底部 HUD 是浮動的，留一段空白，最後一列才不會被壓住 */
.view[hidden]{display:none}

/* 進度＋一鍵列（到校／打掃）：老師一眼看得出還有幾個沒點 */
.statbar{flex:0 0 auto;display:flex;align-items:center;gap:.8vw;flex-wrap:wrap;
  background:var(--board-2);border:1px solid var(--line);border-radius:14px;padding:.7vh 1.1vw}
.statbar .sb-n{font-size:clamp(15px,2vh,24px);color:var(--chalk-2)}
.statbar .sb-n b{font-size:1.25em;color:var(--chalk);font-weight:800}
.statbar .sb-left{color:var(--warn)} .statbar .sb-ok{color:var(--ok)}
.statbar button{font-family:inherit;font-size:clamp(14px,1.9vh,21px);font-weight:700;cursor:pointer;
  border-radius:999px;padding:.4em 1.1em;border:1px solid transparent}
.statbar .sb-all{margin-left:auto;background:var(--ok);color:#082013}
.statbar .sb-clear{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--chalk-3);font-weight:600}
.statbar button:disabled{opacity:.35;cursor:default}

/* 檢核卡：一張卡＝一個小組／一個崗位 */
.zcard{background:var(--board-2);border:1px solid var(--line);border-radius:16px;padding:1.1vh 1.2vw}
.zcard .zhead{display:flex;align-items:baseline;gap:.8vw;flex-wrap:wrap;margin-bottom:.7vh}
.zcard .zname{font-size:clamp(18px,2.5vh,32px);font-weight:800}
.zcard .zsub{font-size:clamp(13px,1.7vh,19px);color:var(--chalk-3)}
.zcard .zsup{margin-left:auto;font-size:clamp(13px,1.7vh,19px);color:var(--blue)}
.people{display:flex;flex-wrap:wrap;gap:.7vmin}
.pcard{min-width:5.2em;padding:.35em .5em;border:3px solid var(--ok);border-radius:14px;cursor:pointer;
  background:rgba(86,197,150,.14);text-align:center;user-select:none;transition:transform .07s}
.pcard:active{transform:scale(.94)}
.pcard .pn{font-size:clamp(20px,2.7vh,34px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pcard .pm{font-size:clamp(11px,1.5vh,17px);color:var(--chalk-3);line-height:1.3}
.pcard .ps{font-size:clamp(12px,1.6vh,18px);font-weight:700;line-height:1.2}
/* 顏色以「語意」命名，不綁狀態序號——各站的第 2 態不是同一件事（打掃 △ 是橘、午餐 ✗ 是粉） */
.pcard.t-idle{border-style:dashed;border-color:var(--line-2);background:var(--board-3)}
.pcard.t-idle .ps{color:var(--chalk-3)}
.pcard.t-ok  {border-color:var(--ok);  background:rgba(86,197,150,.14)} .pcard.t-ok   .ps{color:var(--ok)}
.pcard.t-warn{border-color:var(--warn);background:rgba(240,149,78,.16)} .pcard.t-warn .ps{color:var(--warn)}
.pcard.t-pink{border-color:var(--pink);background:rgba(242,120,155,.16)}.pcard.t-pink .ps{color:var(--pink)}
.pcard.t-blue{border-color:var(--blue);background:rgba(106,166,240,.16)}.pcard.t-blue .ps{color:var(--blue)}
.pcard.t-purple{border-color:var(--purple);background:rgba(167,139,250,.16)}.pcard.t-purple .ps{color:var(--purple)}

/* 到校簽到：座位表輕點（與電子白板同一套手勢） */
.seatgrid{display:flex;flex-direction:column;gap:.8vmin;align-items:center}
.seatgrid .srow{display:flex;gap:.8vmin}
.podium{font-size:clamp(13px,1.7vh,19px);color:var(--chalk-3);border:1px dashed var(--line-2);
  border-radius:10px;padding:.25em 2.5em;margin-bottom:.6vh}
.scell{width:3.2em;height:2.6em;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:clamp(20px,2.8vh,36px);font-weight:800;font-variant-numeric:tabular-nums;
  border:3px solid var(--line-2);border-radius:12px;background:var(--board-2);color:var(--chalk-2);cursor:pointer}
.scell:active{transform:scale(.93)}
.scell.gap{border:none;background:transparent;cursor:default}
.scell .mk{font-size:.42em;line-height:1;margin-top:.1em}
.scell.t-idle{border-style:dashed;border-color:var(--line-2);color:var(--chalk-3);background:var(--board-3)}
.scell.t-ok{border-color:var(--ok);color:var(--ok);background:rgba(86,197,150,.14)}
.scell.t-warn{border-color:var(--warn);color:var(--warn);background:rgba(240,149,78,.14)}
.scell.t-pink{border-color:var(--pink);color:var(--pink);background:rgba(242,120,155,.14)}
/* 簽到感：點下去那一格彈一下＋亮一圈，投影時全班看得到誰被點到 */
.scell.pop{animation:signin .42s ease-out}
@keyframes signin{
  0%{transform:scale(.86);box-shadow:0 0 0 0 rgba(94,201,191,.55)}
  55%{transform:scale(1.12);box-shadow:0 0 0 14px rgba(94,201,191,0)}
  100%{transform:scale(1);box-shadow:0 0 0 0 rgba(94,201,191,0)}
}
@media (prefers-reduced-motion:reduce){.scell.pop{animation:none}}

/* 作業清點／潔牙：座號 chip 一列排開 */
.items{display:flex;flex-direction:column;gap:1.2vh}
.itemrow{background:var(--board-2);border:1px solid var(--line);border-radius:16px;padding:1.2vh 1.2vw}
.itemrow.clear{border-color:rgba(86,197,150,.4);background:rgba(86,197,150,.07)}
/* 前幾天派、還沒交完的作業（結轉追蹤列）：黃框，只提醒不結算 */
.itemrow.carry{border-color:rgba(240,200,90,.5);background:rgba(240,200,90,.07)}
.rowhead .tagold{font-size:clamp(12px,1.6vh,18px);font-weight:700;color:var(--mark);
  border:1px solid rgba(240,200,90,.5);border-radius:999px;padding:.1em .7em}
.carryline{font-size:clamp(13px,1.7vh,20px);color:var(--mark);margin:.2vh 0 .8vh}
.rowhead{display:flex;align-items:baseline;gap:1vw;flex-wrap:wrap;margin-bottom:.8vh}
.rowhead .name{font-size:clamp(20px,2.8vh,36px);font-weight:800;color:var(--chalk)}
.rowhead .cnt{font-size:clamp(14px,1.9vh,22px);color:var(--chalk-2);font-variant-numeric:tabular-nums}
.rowhead .cnt b{font-weight:800}
.rowhead .cnt .u{color:var(--chalk-3)} .rowhead .cnt .a{color:var(--blue)}
.rowhead .cnt .c{color:var(--warn)} .rowhead .cnt .d{color:var(--ok)}
.rowhead .grow{flex:1 1 auto}
.rowhead .reset{font-family:inherit;font-size:13px;color:var(--chalk-3);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.rowhead .reset:hover{color:var(--chalk-2)}
.chips{display:flex;flex-wrap:wrap;gap:.6vmin}
.chip{display:inline-flex;align-items:center;justify-content:center;
  font-size:clamp(22px,3vh,38px);font-weight:700;font-variant-numeric:tabular-nums;
  min-width:1.9em;padding:.12em .18em;border:3px solid var(--chalk-3);border-radius:12px;cursor:pointer;
  color:var(--chalk-2);background:var(--board-3);user-select:none;transition:transform .07s}
.chip:active{transform:scale(.92)}
.chip.s1{border-color:var(--blue);color:var(--blue);background:rgba(106,166,240,.14)}
.chip.s2{border-color:var(--warn);color:var(--warn);background:rgba(240,149,78,.16)}
.chip.s3{border-color:var(--ok);color:#0f1f14;background:var(--ok)}
.chip.bad{border-color:var(--pink);color:var(--pink);background:rgba(242,120,155,.16)}
.rowclear{color:var(--ok);font-size:clamp(18px,2.4vh,30px);font-weight:700}
.rowclear .sub{color:var(--chalk-3);font-size:.6em;font-weight:400;margin-left:.6em}

/* 點完之後的「修復方式」大字條（這支工具最大的教育價值，要投影得出來） */
.fixbar{position:fixed;left:50%;bottom:11vh;transform:translateX(-50%);z-index:20;
  max-width:92vw;background:var(--board-2);border:2px solid var(--mark);border-radius:18px;
  padding:1.2vh 2vw;box-shadow:0 18px 48px rgba(0,0,0,.5);display:none}
.fixbar.show{display:block}
.fixbar .who{font-size:clamp(20px,2.8vh,36px);font-weight:800;margin-bottom:.25em}
.fixbar .fix{font-size:clamp(18px,2.4vh,30px);color:var(--mark);line-height:1.5}

/* 區塊標題（今日清點／過去未完成）與派出日期膠囊 */
.hwsec{display:flex;flex-direction:column;gap:.9vh;margin-top:1.4vh;border-top:1px dashed var(--line);padding-top:1.2vh}
.hwsec-h{display:flex;align-items:baseline;gap:.9vw;flex-wrap:wrap}
.hwsec-h .t{font-size:clamp(17px,2.3vh,28px);font-weight:800;color:var(--chalk)}
.hwsec-h .s{font-size:clamp(12px,1.6vh,18px);color:var(--chalk-3)}
.rowhead .tagday{font-size:clamp(12px,1.6vh,18px);font-weight:700;color:var(--chalk-3);
  border:1px solid var(--line);border-radius:999px;padding:.1em .7em}

/* 作業清點＝座位表模式（2026-09-08 老師拍板）：一格＝一位學生，格子裡只留他還沒完成的作業，
   交完就少一個徽章，全部交齊整格變暗。收單科時可切成單項模式（一點一格）。 */
.hwpills{display:flex;gap:.5vw;flex-wrap:wrap;margin-bottom:.4vh}
.hwpills .hp{font-family:inherit;font-size:clamp(13px,1.8vh,20px);font-weight:700;color:var(--chalk-2);
  background:var(--board-3);border:2px solid var(--line-2);border-radius:999px;padding:.35em .95em;cursor:pointer}
.hwpills .hp.on{background:var(--duty);border-color:transparent;color:#08201d}
.hwpills .hp.ok{border-color:rgba(86,197,150,.5)}
.hwpills .hp .n{font-size:.78em;opacity:.8;margin-left:.4em;font-weight:600}
.hwpills .pgrow{flex:1 1 auto}
/* 版面切換：座位表看得出「誰」沒交，座號清單登記最快——兩種都留，老師自己選（2026-09-08） */
.layoutsw{display:flex;gap:.25em;background:var(--board-3);border:2px solid var(--line-2);
  border-radius:999px;padding:.15em}
.hwpills .lw{font-family:inherit;font-size:clamp(13px,1.7vh,19px);font-weight:700;color:var(--chalk-3);
  background:transparent;border:none;border-radius:999px;padding:.3em .9em;cursor:pointer}
.hwpills .lw.on{background:var(--blue);color:#08152a}
.hwpills .lw.solo{border:2px solid var(--line-2);background:var(--board-3);margin-left:.4em}
.hwpills .lw.solo.on{background:var(--mark);color:#221a05;border-color:transparent}
.hwlegend{display:flex;gap:1.2vw;flex-wrap:wrap;font-size:clamp(12px,1.6vh,18px);color:var(--chalk-3)}
.hwlegend .li b{color:var(--chalk);font-weight:800;margin-right:.25em}
.hwlegend .li i{font-style:normal;color:var(--mark);margin-left:.4em}

.seatgrid.agggrid .podium,.seatgrid.hwgrid .podium{padding:.15em 2em;font-size:clamp(11px,1.4vh,15px);margin-bottom:.4vh}
.gridtip{text-align:center;color:var(--chalk-3);font-size:clamp(12px,1.6vh,17px);margin-top:.3vh}
.scell.t-blue{border-color:var(--blue);color:var(--blue);background:rgba(106,166,240,.16)}
.hwcell{width:2.9em;height:2.4em;font-size:clamp(18px,2.4vh,30px)}
.hwcell .mk{font-size:.4em;opacity:.9}

/* 聚合格：座號＋未完成作業徽章 */
/* 欄要對齊：格子一律固定寬（含走道的空格），不然 flex 的 min-width:auto 會讓
   徽章多的格子自己撐大，同一直行就對不齊——座位表對不上就失去「照座位認人」的意義。 */
.seatgrid.agggrid .scell{flex:0 0 6.6em;width:6.6em;min-width:6.6em;max-width:6.6em;box-sizing:border-box}
.seatgrid.hwgrid .scell{flex:0 0 3.2em;width:3.2em;min-width:3.2em;max-width:3.2em;box-sizing:border-box}
.scell.agg{height:auto;min-height:3.4em;padding:.3em .25em;gap:.2em;overflow:hidden;
  border-color:var(--line-2);background:var(--board-2);color:var(--chalk)}
.scell.agg .sn{font-size:clamp(19px,2.5vh,31px);font-weight:800;line-height:1}
.scell.agg .bd{display:flex;flex-wrap:wrap;gap:.18em;justify-content:center;max-width:100%}
.scell.agg .b{font-size:clamp(10px,1.35vh,15px);font-weight:700;line-height:1.25;border-radius:6px;
  padding:.1em .35em;border:1px solid transparent}
.scell.agg .b.s0{color:var(--pink);border-color:rgba(242,120,155,.55);background:rgba(242,120,155,.14)}
.scell.agg .b.s1{color:var(--blue);border-color:rgba(106,166,240,.5);background:rgba(106,166,240,.14)}
.scell.agg .b.s2{color:var(--warn);border-color:rgba(240,149,78,.55);background:rgba(240,149,78,.16)}
.scell.agg .b.old{border-style:dashed}
.scell.agg .ok{font-size:clamp(10px,1.35vh,15px);color:var(--ok);font-weight:700}
.scell.agg.alldone{opacity:.42;border-style:dashed;border-color:var(--line-2);background:var(--board-3)}

/* 過去未完成：一列一份，不再各給一張座位表（省高度，投影才看得完） */
.oldline{display:flex;align-items:center;gap:.8vw;flex-wrap:wrap;
  background:rgba(240,200,90,.07);border:1px solid rgba(240,200,90,.4);border-radius:14px;padding:.7vh 1vw}
.oldline .dy{font-size:clamp(12px,1.6vh,18px);font-weight:700;color:var(--mark)}
.oldline .nm{font-size:clamp(15px,2vh,26px);font-weight:800;color:var(--chalk)}
.oldline .who{font-size:clamp(13px,1.7vh,20px);color:var(--chalk-2);flex:1 1 12em}
.oldline .aged{font-size:clamp(12px,1.6vh,18px);color:var(--pink);font-weight:700}

/* 側面板：某位學生的逐項狀態 */
.panel .seatrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.panel .seatrow.done{opacity:.5}
.panel .seatrow .nm{flex:1 1 auto;font-size:15.5px;font-weight:700}
.panel .seatrow .nm .dy{font-size:12.5px;font-weight:400;color:var(--chalk-3);margin-left:8px}
.panel .seatrow .stbtn{min-width:76px;font-size:14.5px;font-weight:700;border:2px solid var(--line-2);
  border-radius:999px;padding:6px 12px;background:var(--board-3);color:var(--chalk-2)}
.panel .seatrow .stbtn.t-pink{border-color:var(--pink);color:var(--pink);background:rgba(242,120,155,.14)}
.panel .seatrow .stbtn.t-blue{border-color:var(--blue);color:var(--blue);background:rgba(106,166,240,.14)}
.panel .seatrow .stbtn.t-warn{border-color:var(--warn);color:var(--warn);background:rgba(240,149,78,.16)}
.panel .seatrow .stbtn.t-ok{border-color:var(--ok);color:var(--ok);background:rgba(86,197,150,.16)}

/* 浮動支援選人面板 */
.panel .supgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.panel .supgrid .stbtn{min-width:64px;font-size:16px;font-weight:700;border:2px solid var(--line-2);
  border-radius:999px;padding:8px 12px;background:var(--board-3);color:var(--chalk-2);cursor:pointer}
.panel .supgrid .stbtn.t-blue{border-color:var(--blue);color:var(--blue);background:rgba(106,166,240,.14)}
.pcard.addsup .pn{color:var(--blue)}

/* 本週總覽：座號 × 週一～週五 */
.week{width:100%;border-collapse:collapse;font-size:13.5px}
.week th,.week td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.week th{color:var(--chalk-3);font-weight:600}

@media (max-width:900px){
  /* 手機／平板：座位表比螢幕寬時，讓網格自己橫向捲（頁面本身不得橫向捲動）。 */
  .view{overflow-x:hidden}
  .seatgrid{align-self:stretch;align-items:flex-start;overflow-x:auto;padding-bottom:.4em}
  .seatgrid .srow{flex:0 0 auto}
  .pcard{min-width:4.4em}
  .scell{width:2.8em;height:2.3em}
  .tabs button{font-size:clamp(13px,1.9vh,19px);padding:.45em .8em}
  .itemrow{padding:1vh 3vw}
  .chip{font-size:clamp(20px,2.6vh,32px)}
  .seatgrid.agggrid .scell{flex-basis:5.6em;width:5.6em;min-width:5.6em;max-width:5.6em}
  .seatgrid.hwgrid .scell{flex-basis:2.8em;width:2.8em;min-width:2.8em;max-width:2.8em}
  .hwcell{height:2.1em}
  .hwcell{width:2.6em;height:2.1em}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="head">
    <h1>工作檢核台<span class="sub" id="subtitle">點座號簽到</span></h1>
    <span class="grow"></span>
    <span class="stat">今日待送 <b id="pend">0</b> 筆</span>
  </div>

  <div class="tabs">
    <button type="button" id="tab-arrive" class="on"><span class="step">1</span>🚪 到校簽到</button>
    <button type="button" id="tab-clean"><span class="step">2</span>🧹 打掃工作</button>
    <button type="button" id="tab-hw"><span class="step">3</span>📚 作業清點</button>
    <button type="button" id="tab-lunch"><span class="step">4</span>🍚 午餐工作</button>
    <button type="button" id="tab-teeth"><span class="step">5</span>🦷 潔牙</button>
    <span class="ztabs" id="zonetabs"></span>
    <span class="grow"></span>
    <span class="legend" id="legend"></span>
  </div>

  <div class="view" id="view-arrive"></div>
  <div class="view" id="view-clean" hidden></div>
  <div class="view" id="view-hw" hidden></div>
  <div class="view" id="view-lunch" hidden></div>
  <div class="view" id="view-teeth" hidden></div>
</div>

<div class="fixbar" id="fixbar">
  <div class="who" id="fix-who"></div>
  <div class="fix" id="fix-text"></div>
</div>

<div class="hud" id="hud">
  <button type="button" id="btn-settle" class="primary">📤 結算本站到待送</button>
  <span class="tip" id="settled"></span>
  <span class="sep"></span>
  <button type="button" id="btn-week" hidden>📅 本週總覽</button>
  <button type="button" id="btn-reload">☁ 重讀雲端資料</button>
  <span class="sep"></span>
  <button type="button" id="btn-full">全螢幕</button>
  <a class="tip" href="index.html">← 工作台</a>
</div>

<aside class="panel" id="panel">
  <div id="panel-body"></div>
