<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>錯題紀錄表｜教師專區</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>" />
<style>
/* 錯題紀錄表（2026-10-18 上線）：教師專區進入、不投影。只用座號；登記只存在這台電腦（quizErrors.draft.v1），
   不送任何資料——成績靠「複製成績」貼給 AI 記錄。考卷檔不進 repo（公開），由老師從雲端硬碟 private/exams/ 匯入這台電腦（quizErrors.exams.v1）。 */
[hidden]{display:none!important}
:root{
  --bg:#0b0f18; --surface:#161d2b; --surface-2:#1e2634; --line:#2b3546;
  --ink:#e8edf5; --mute:#97a3b6; --ok:#56c596; --warn:#f0954e; --bad:#ef6b6b; --mark:#f0c85a; --accent:#6aa8ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:rgba(11,15,24,.96);border-bottom:1px solid var(--line);padding:10px 16px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
h1{font-size:19px;margin:0 0 6px}
h2{font-size:17px;margin:22px 0 10px}
h3{font-size:15px;margin:16px 0 6px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=number],input[type=text]{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font:inherit}
input[type=number]{width:70px}
button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#081120}
button.ghost{background:none}
.tabs button{border-radius:999px}
.hint{color:var(--mute);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
/* 座號格 */
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.seat{padding:8px 0;text-align:center;border-radius:8px;position:relative}
.seat.done{border-color:var(--ok)}
.seat.cur{background:var(--accent);color:#081120;border-color:var(--accent)}
.seat.abs{opacity:.45;text-decoration:line-through}
.seat small{display:block;font-size:11px;font-weight:400;opacity:.85}
/* 題目格 */
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.q{padding:6px 4px;text-align:center;border-radius:8px;line-height:1.25}
.q .n{display:block;font-size:15px}
.q .p{display:block;font-size:11px;font-weight:400;color:var(--mute)}
.q.full{background:var(--bad);border-color:var(--bad);color:#fff}
.q.part{background:var(--warn);border-color:var(--warn);color:#1a0f05}
.q.full .p,.q.part .p{color:inherit}
/* 依題目模式 */
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{min-width:34px;padding:3px 0;font-size:13px;text-align:center;border-radius:6px}
.chip.full{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.part{background:var(--warn);border-color:var(--warn);color:#1a0f05}
.chip.abs{visibility:hidden}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--mute)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.lv-bad{color:var(--bad);font-weight:700} .lv-warn{color:var(--warn);font-weight:700} .lv-ok{color:var(--ok)}
textarea{width:100%;min-height:150px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:8px;font:13px/1.6 ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);
  padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.scroll{overflow-x:auto}
@media (max-width:640px){ .qs{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))} th,td{padding:5px 4px} }
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-bottom:0">
    <h1>📝 平時卷錯題紀錄表 <a href="teacher.html" style="font-size:13px;color:var(--mute);margin-left:8px">← 回教師專區</a></h1>
    <div class="row">
      <label>考卷 <select id="exam"></select></label>
      <button type="button" id="imp">📂 匯入考卷</button><input type="file" id="impf" accept=".json,application/json" multiple hidden>
      <span class="hint" id="n"></span>
      <span class="tabs row" id="modes">
        <button data-m="seat">👤 依學生登記</button>
        <button data-m="q">❓ 依題目登記</button>
        <button data-m="report">📊 分析與成績</button>
      </span>
    </div>
  </div>
</header>

<div class="wrap" id="main"></div>
<div class="wrap" id="gate" hidden><div class="card">這一頁只給老師看。請先到 <a href="teacher.html" style="color:var(--accent)">教師專區</a> 輸入口令，再從那裡點「📝 錯題紀錄表」進來。</div></div>
<div class="wrap" id="noseat" hidden><div class="card">還沒設定班級座號。請先回 <a href="teacher.html" style="color:var(--accent)">教師專區</a> 設定座號。</div></div>
<div class="toast" id="toast"></div>

<script src="assets/js/common.js?v=20261018-2"></script>
<script>
/* ── 考卷資料：不放在網頁裡（班網與本站是公開 repo，學年統一開放日前試卷與答案都不能公開）──
   考卷檔（.json）放在雲端硬碟 class-manager/private/exams/（已 gitignore），用上方「📂 匯入考卷」讀進這台電腦。
   每題：[題號, 配分, 答案, 知識點代號]；部分給分＝點同一格會依序 扣滿分 → 扣少一點 → … → 扣1分 → 取消。 */
var EXKEY = 'quizErrors.exams.v1';
var EXAMS = (function () { try { var a = JSON.parse(localStorage.getItem(EXKEY)); return Array.isArray(a) ? a : []; } catch (e) { return []; } })();
function saveExams() { try { localStorage.setItem(EXKEY, JSON.stringify(EXAMS)); } catch (e) {} }
function validExam(e) {
  if (!e || e.format !== 'quiz-exam/1' || !e.id || !e.title || !e.subj || !e.tags || !Array.isArray(e.sections)) return '不是錯題表考卷檔';
  var pts = 0, bad = '';
  e.sections.forEach(function (sec) { (sec.items || []).forEach(function (it) { pts += +it[1] || 0; if (!e.tags[it[3]]) bad = it[0]; }); });
  if (bad) return '第「' + bad + '」題的知識點代號不在分類裡';
  if (pts !== 100) return '配分合計 ' + pts + ' 分，不是 100';
  return '';
}

/* ── 狀態（只存在這台瀏覽器；只有座號、沒有姓名）── */
var KEY = 'quizErrors.draft.v1';
/* 座號一律取工作台設定（ClassManager.requireSeats），不自己假設人數。 */
var SEATS = (window.ClassManager && ClassManager.requireSeats()) || [];
var S = load() || { exam: '', mode: 'seat', cur: SEATS[0] || 1, data: {} };
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function exam() { return EXAMS.filter(function (e) { return e.id === S.exam; })[0] || EXAMS[0]; }
function D() {                        // 該卷的登記：{ ded: {題id: {座號: 扣分}}, abs: {座號:1} }
  var d = S.data[S.exam]; if (!d) d = S.data[S.exam] = { ded: {}, abs: {} };
  return d;
}
function items() {
  var out = [];
  exam().sections.forEach(function (sec, si) {
    sec.items.forEach(function (it) { out.push({ id: si + ':' + it[0], sec: sec.name, no: it[0], pts: it[1], ans: it[2], tag: it[3] }); });
  });
  return out;
}
function seats() { return SEATS; }
function nextSeat(s) { var i = SEATS.indexOf(s); return SEATS[(i + 1) % SEATS.length]; }
function ded(qid, s) { var m = D().ded[qid]; return (m && m[s]) || 0; }
function setDed(qid, s, v) {
  var d = D(); if (!d.ded[qid]) d.ded[qid] = {};
  if (v) d.ded[qid][s] = v; else delete d.ded[qid][s];
  save();
}
/* 點一下：0 → 扣滿分 → 扣滿分−1 → … → 扣1分 → 0 */
function cycle(q, s) {
  var v = ded(q.id, s);
  var nv = v === 0 ? q.pts : v - 1;
  setDed(q.id, s, nv);
  return nv;
}
function isAbs(s) { return !!D().abs[s]; }
function touched(s) {                // 這位學生是否已登記過（有錯題或已按「全對」）
  var d = D(); if (d.ok && d.ok[s]) return true;
  return items().some(function (q) { return ded(q.id, s) > 0; });
}
function score(s) {
  var lost = 0; items().forEach(function (q) { lost += ded(q.id, s); });
  return 100 - lost;
}
function totalPts() { return items().reduce(function (a, q) { return a + q.pts; }, 0); }
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function toast(t) { var e = document.getElementById('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('show'); }, 1600); }

/* ── 畫面 ── */
var main = document.getElementById('main');
function paint() {
  if (!EXAMS.length) { main.innerHTML = '<div class="card">這台電腦還沒有考卷。按上方「📂 匯入考卷」，選雲端硬碟 <b>班級事務/class-manager/private/exams/</b> 裡的考卷檔（可一次選多份）。<div class="hint">考卷檔由 Claude「建錯題表」產生；不放在網站上，學年開放日前試卷與答案都不會公開。</div></div>'; return; }
  document.querySelectorAll('#modes button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === S.mode); });
  if (totalPts() !== 100) { main.innerHTML = '<div class="card lv-bad">⚠️ 這份卷配分合計 ' + totalPts() + ' 分，不是 100，請先核對題目資料。</div>'; return; }
  if (S.mode === 'seat') paintSeat(); else if (S.mode === 'q') paintQ(); else paintReport();
}

/* 模式一：依學生（拿著一張考卷，點錯的題目）*/
function paintSeat() {
  var s = S.cur, ex = exam();
  var h = '<p class="hint">流程：點座號 → 照考卷點「錯的題目」（紅＝扣滿分；多分題再點會變橘＝部分扣分）→ 對照考卷上的分數 → 「下一位」。</p>';
  h += '<div class="card"><div class="seats">' + seats().map(function (x) {
    var c = 'seat' + (x === s ? ' cur' : '') + (touched(x) ? ' done' : '') + (isAbs(x) ? ' abs' : '');
    var sub = isAbs(x) ? '缺考' : (touched(x) ? score(x) : '');
    return '<button class="' + c + '" data-seat="' + x + '">' + x + '<small>' + (sub === '' ? '&nbsp;' : sub) + '</small></button>';
  }).join('') + '</div></div>';
  h += '<div class="card"><div class="row" style="justify-content:space-between">' +
       '<div><b style="font-size:20px">' + s + ' 號</b>　算出分數：<b style="font-size:22px" class="' + (isAbs(s) ? 'hint' : '') + '">' + (isAbs(s) ? '缺考' : score(s) + ' 分') + '</b></div>' +
       '<div class="row"><button id="allok">✓ 全對</button><button id="abs">' + (isAbs(s) ? '取消缺考' : '缺考') + '</button>' +
       '<button id="clr" class="ghost">清除此人</button><button id="next" class="on">下一位 →</button></div></div>';
  if (!isAbs(s)) ex.sections.forEach(function (sec, si) {
    h += '<h3>' + esc(sec.name) + '</h3><div class="qs">' + sec.items.map(function (it) {
      var q = { id: si + ':' + it[0], pts: it[1] }, v = ded(q.id, s);
      var c = 'q' + (v === 0 ? '' : v === q.pts ? ' full' : ' part');
      var p = v === 0 ? it[1] + '分' + (it[2] ? '・' + esc(it[2]) : '') : (v === q.pts ? '扣 ' + v : '部分扣 ' + v);
      return '<button class="' + c + '" data-q="' + esc(q.id) + '" data-pts="' + q.pts + '"><span class="n">' + esc(it[0]) + '</span><span class="p">' + p + '</span></button>';
    }).join('') + '</div>';
  });
  h += '</div>';
  main.innerHTML = h;
  main.querySelectorAll('[data-seat]').forEach(function (b) { b.onclick = function () { S.cur = +b.dataset.seat; save(); paint(); }; });
  main.querySelectorAll('[data-q]').forEach(function (b) { b.onclick = function () { cycle({ id: b.dataset.q, pts: +b.dataset.pts }, s); markOk(s, false); paint(); }; });
  document.getElementById('next').onclick = function () { if (!touched(s) && !isAbs(s)) markOk(s, true); S.cur = nextSeat(s); save(); paint(); };
  document.getElementById('allok').onclick = function () { items().forEach(function (q) { setDed(q.id, s, 0); }); markOk(s, true); toast(s + ' 號 全對 100 分'); S.cur = nextSeat(s); save(); paint(); };
  document.getElementById('abs').onclick = function () { var d = D(); if (d.abs[s]) delete d.abs[s]; else d.abs[s] = 1; save(); paint(); };
  document.getElementById('clr').onclick = function () { if (!confirm('清除 ' + s + ' 號這份考卷的登記？')) return; items().forEach(function (q) { setDed(q.id, s, 0); }); markOk(s, false); delete D().abs[s]; save(); paint(); };
}
function markOk(s, v) { var d = D(); if (!d.ok) d.ok = {}; if (v) d.ok[s] = 1; else delete d.ok[s]; save(); }

/* 模式二：依題目（一題一列，點錯的座號；也可直接打「3,5,12」或「5(-2)」）*/
function paintQ() {
  var h = '<p class="hint">一題一列：點座號＝扣滿分，再點變部分扣分；或在右邊輸入框打「3,5,12」，部分扣分寫「5(-1)」，按 Enter 套用。缺考的座號在「依學生登記」設定。</p>';
  exam().sections.forEach(function (sec, si) {
    h += '<h3>' + esc(sec.name) + '</h3><div class="card scroll"><table><tr><th style="width:90px">題號</th><th>錯的座號</th><th style="width:170px">快速輸入</th></tr>';
    sec.items.forEach(function (it) {
      var id = si + ':' + it[0];
      h += '<tr><td><b>' + esc(it[0]) + '</b><br><span class="hint">' + it[1] + '分' + (it[2] ? '・' + esc(it[2]) : '') + '</span></td><td><div class="chips">' +
        seats().map(function (x) {
          var v = ded(id, x), c = 'chip' + (isAbs(x) ? ' abs' : v === 0 ? '' : v === it[1] ? ' full' : ' part');
          return '<button class="' + c + '" data-q="' + esc(id) + '" data-pts="' + it[1] + '" data-s="' + x + '">' + x + (v && v !== it[1] ? '<sup>-' + v + '</sup>' : '') + '</button>';
        }).join('') + '</div></td><td><input type="text" style="width:100%" placeholder="例：3,5(-1),12" data-in="' + esc(id) + '" data-pts="' + it[1] + '" value="' + esc(qText(id, it[1])) + '"></td></tr>';
    });
    h += '</table></div>';
  });
  main.innerHTML = h;
  main.querySelectorAll('[data-s]').forEach(function (b) { b.onclick = function () { cycle({ id: b.dataset.q, pts: +b.dataset.pts }, +b.dataset.s); paint(); }; });
  main.querySelectorAll('[data-in]').forEach(function (inp) {
    inp.onkeydown = function (e) { if (e.key === 'Enter') applyText(inp); };
    inp.onblur = function () { applyText(inp); };
  });
}
function qText(id, pts) {
  var m = D().ded[id] || {};
  return Object.keys(m).map(Number).sort(function (a, b) { return a - b; })
    .map(function (s) { return m[s] === pts ? String(s) : s + '(-' + m[s] + ')'; }).join(',');
}
function applyText(inp) {
  var id = inp.dataset.in, pts = +inp.dataset.pts, bad = [];
  var next = {};
  inp.value.split(/[,，、\s]+/).filter(Boolean).forEach(function (tok) {
    var m = tok.match(/^(\d+)(?:\(-?(\d+)\))?$/);
    if (!m) { bad.push(tok); return; }
    var s = +m[1], v = m[2] ? +m[2] : pts;
    if (SEATS.indexOf(s) < 0 || v < 1 || v > pts) { bad.push(tok); return; }
    next[s] = v;
  });
  if (bad.length) { toast('看不懂：' + bad.join('、') + '（座號要在班級座號內，扣分不可超過 ' + pts + '）'); return; }
  var old = JSON.stringify(D().ded[id] || {});
  D().ded[id] = next; save();
  if (old !== JSON.stringify(next)) paint();
}

/* 模式三：分析與成績 */
function paintReport() {
  var ex = exam(), qs = items();
  var takers = seats().filter(function (s) { return !isAbs(s) && touched(s); });
  var missing = seats().filter(function (s) { return !isAbs(s) && !touched(s); });
  var absent = seats().filter(isAbs);
  var h = '';
  h += '<div class="card"><b>登記進度</b>：已登記 ' + takers.length + ' 人、缺考 ' + absent.length + ' 人' +
       (missing.length ? '、<span class="lv-warn">尚未登記 ' + missing.length + ' 人（' + missing.join('、') + ' 號）</span>' : '，全班登記完成 ✅') +
       '<div class="hint">尚未登記的人不列入下面的統計；確定沒錯題的請按「✓ 全對」。</div></div>';
  if (!takers.length) { main.innerHTML = h; return; }

  // 1. 知識點（全班）
  var tagStat = {};
  Object.keys(ex.tags).forEach(function (t) { tagStat[t] = { full: 0, lost: 0 }; });
  qs.forEach(function (q) { takers.forEach(function (s) { tagStat[q.tag].full += q.pts; tagStat[q.tag].lost += ded(q.id, s); }); });
  h += '<h2>① 全班知識點得分率</h2><div class="card scroll"><table><tr><th>知識點</th><th style="width:40%">得分率</th><th>判讀</th></tr>';
  Object.keys(ex.tags).forEach(function (t) {
    var st = tagStat[t]; if (!st.full) return;
    var r = Math.floor((1 - st.lost / st.full) * 1000 + 0.5) / 10;
    h += '<tr><td>' + esc(ex.tags[t][0]) + '</td><td><div class="row"><div class="bar" style="flex:1"><i style="width:' + r + '%"></i></div> ' + r + '%</div></td><td>' + level(r) + '</td></tr>';
  });
  h += '</table></div>';

  // 2. 各題答對率（列出需要處理的題目）
  var qRows = qs.map(function (q) {
    var wrong = takers.filter(function (s) { return ded(q.id, s) > 0; });
    var r = Math.floor((1 - wrong.length / takers.length) * 1000 + 0.5) / 10;
    return { q: q, wrong: wrong, r: r };
  });
  var hard = qRows.filter(function (x) { return x.r < 80; }).sort(function (a, b) { return a.r - b.r; });
  h += '<h2>② 需要回頭講的題目（答對率低於 80%）</h2>';
  h += hard.length ? '<div class="card scroll"><table><tr><th>題目</th><th>知識點</th><th class="num">答對率</th><th>判讀</th><th>錯的座號</th></tr>' +
    hard.map(function (x) {
      return '<tr><td>' + esc(x.q.sec.split('（')[0]) + ' ' + esc(x.q.no) + '</td><td><span class="tag">' + esc(ex.tags[x.q.tag][0]) + '</span></td><td class="num">' + x.r + '%</td><td>' + level(x.r) + '</td><td>' + x.wrong.join('、') + '</td></tr>';
    }).join('') + '</table></div>' : '<div class="card lv-ok">每一題答對率都在 80% 以上 👍</div>';

  // 3. 個人複習建議
  h += '<h2>③ 個人複習建議（給學生／家長，只看自己）</h2><div class="card scroll"><table><tr><th>座號</th><th class="num">分數</th><th>要加強的知識點</th><th>複習建議</th></tr>';
  takers.forEach(function (s) {
    var weak = Object.keys(ex.tags).map(function (t) {
      var full = 0, lost = 0;
      qs.forEach(function (q) { if (q.tag === t) { full += q.pts; lost += ded(q.id, s); } });
      return { t: t, full: full, lost: lost, r: full ? 1 - lost / full : 1 };
    }).filter(function (w) { return w.full && w.lost >= 2 && w.r < 0.8; })
      .sort(function (a, b) { return a.r - b.r || b.lost - a.lost; }).slice(0, 2);
    h += '<tr><td><b>' + s + '</b></td><td class="num">' + score(s) + '</td><td>' +
      (weak.length ? weak.map(function (w) { return '<span class="tag">' + esc(ex.tags[w.t][0]) + '・扣' + w.lost + '分</span>'; }).join(' ') : '<span class="lv-ok">各知識點都穩定</span>') +
      '</td><td>' + (weak.length ? weak.map(function (w) { return esc(ex.tags[w.t][1]); }).join('<br>') : '維持好習慣，訂正錯的題目即可。') + '</td></tr>';
  });
  h += '</table></div>';

  // 4. 成績（貼給 class-log）
  var lines = seats().map(function (s) {
    if (isAbs(s)) return '座號' + s + ' ' + ex.subj + ' ' + ex.name + ' 缺考';
    if (!touched(s)) return null;
    return '座號' + s + ' ' + ex.subj + ' ' + ex.name + ' ' + score(s) + '分';
  }).filter(Boolean);
  h += '<h2>④ 成績（複製後貼給 AI「記錄：」即入紀錄庫平時考）</h2><div class="card"><textarea id="out" readonly>' + esc(lines.join('\n')) + '</textarea>' +
       '<div class="row" style="margin-top:8px"><button id="copy" class="on">複製成績</button><button id="json">下載完整登記（JSON）</button>' +
       '<span class="hint">分數＝100 − 錯題扣分；請和考卷上的分數對一次。</span></div></div>';
  main.innerHTML = h;
  document.getElementById('copy').onclick = function () {
    var t = document.getElementById('out'); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(function () { toast('已複製 ' + lines.length + ' 行'); }, function () { document.execCommand('copy'); toast('已複製'); });
  };
  document.getElementById('json').onclick = function () {
    var blob = new Blob([JSON.stringify({ exam: ex.id, seats: SEATS, data: D(), exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ex.id + '_錯題登記.json'; a.click();
  };
}
function level(r) {
  if (r < 60) return '<span class="lv-bad">全班重教</span>';
  if (r < 80) return '<span class="lv-warn">課堂再提醒</span>';
  return '<span class="lv-ok">穩定</span>';
}

/* ── 初始化 ── */
var pwOk = false; try { pwOk = !!sessionStorage.getItem('cm.teacherPw'); } catch (e) {}
if (!pwOk || !SEATS.length) {
  main.hidden = true; document.querySelector('header .row').hidden = true;
  document.getElementById(pwOk ? 'noseat' : 'gate').hidden = false;
  throw new Error('quiz: gate');
}
var sel = document.getElementById('exam');
function fillSel() {
  sel.innerHTML = EXAMS.length ? EXAMS.map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.title) + '</option>'; }).join('') : '<option value="">（尚未匯入）</option>';
  if (!EXAMS.some(function (e) { return e.id === S.exam; })) S.exam = EXAMS.length ? EXAMS[EXAMS.length - 1].id : '';
  sel.value = S.exam;
}
fillSel();
var impf = document.getElementById('impf');
document.getElementById('imp').onclick = function () { impf.value = ''; impf.click(); };
impf.onchange = function () {
  var files = Array.prototype.slice.call(impf.files || []), ok = [], bad = [];
  Promise.all(files.map(function (f) {
    return f.text().then(function (t) {
      var e; try { e = JSON.parse(t); } catch (x) { bad.push(f.name + '：讀不懂'); return; }
      var why = validExam(e); if (why) { bad.push(f.name + '：' + why); return; }
      EXAMS = EXAMS.filter(function (x) { return x.id !== e.id; }); EXAMS.push(e); ok.push(e);
    });
  })).then(function () {
    saveExams();
    if (ok.length) S.exam = ok[ok.length - 1].id;
    save(); fillSel(); paint();
    toast((ok.length ? '已匯入 ' + ok.length + ' 份' : '') + (bad.length ? '　⚠️ ' + bad.join('；') : ''));
  });
};
sel.onchange = function () { S.exam = sel.value; S.cur = 1; save(); paint(); };
document.getElementById('n').textContent = '全班 ' + SEATS.length + ' 人（教師專區設定）';
if (SEATS.indexOf(S.cur) < 0) S.cur = SEATS[0];
document.querySelectorAll('#modes button').forEach(function (b) { b.onclick = function () { S.mode = b.dataset.m; save(); paint(); scrollTo(0, 0); }; });
paint();
</script>
</body>
</html>
